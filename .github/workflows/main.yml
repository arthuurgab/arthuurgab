name: Generate Snake

on:
  # Executa a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  # Permite executar manualmente
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update snake
    runs-on: ubuntu-latest

    steps:
      # Gera a animação Snake
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: arthuurgab
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publica na branch output
      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          build_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
